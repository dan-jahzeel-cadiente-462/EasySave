services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: easysave-php
    volumes:
      - .:/app
    environment:
      APP_ENV: dev
      DATABASE_URL: mysql://easysave:easysave_pass@db:3306/easysave
    networks:
      - easysave-network

  web:
    image: nginx:alpine
    container_name: easysave-web
    ports:
      - "8080:80"
    volumes:
      - .:/app
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./nginx-main.conf:/etc/nginx/conf.d/nginx-main.conf
    depends_on:
      - php
    networks:
      - easysave-network

  db:
    image: mysql:8.0
    container_name: easysave-db
    environment:
      MYSQL_DATABASE: easysave
      MYSQL_USER: easysave
      MYSQL_PASSWORD: easysave_pass
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - easysave-network

networks:
  easysave-network:
    driver: bridge

volumes:
  mysql-data:
    driver: local
