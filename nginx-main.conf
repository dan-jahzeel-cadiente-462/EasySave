# Upstream PHP-FPM
# Default points to the `php` service in multi-container setups (docker-compose).
# For single-container runtime (production image) this file is adjusted at build-time
# to point to 127.0.0.1:9000 instead of `php:9000` so nginx can reach the local php-fpm.
upstream php-upstream {
    server php:9000;
}

# Upstream WebSocket server
# In compose this points to the `websocket` service; in single-container image
# the runtime Dockerfile will rewrite this to 127.0.0.1:8080 when needed.
upstream ws-upstream {
    server websocket:8080;
}

# Server configuration
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /app/public;
    index index.php index.html;

    client_max_body_size 50M;

    # Logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # Deny access to sensitive directories
    location ~ ^/(\.git|\.env|config/|src/|vendor/|migrations/) {
        deny all;
        return 403;
    }

    # Static file caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|map)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Main application routing
    location / {
        # Try files, then directories, then fall back to index.php
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # WebSocket proxy (path: /ws/ or /ws)
    # Upgrade requests to the websocket backend. Keep long timeouts for real-time connections.
    location /ws/ {
        proxy_pass http://ws-upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
    }

    # PHP-FPM handling
    location ~ ^/index\.php(/|$) {
        fastcgi_pass php-upstream;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTP_PROXY "";
        
        # Performance tuning
        fastcgi_buffering on;
        fastcgi_buffer_size 256k;
        fastcgi_buffers 512 32k;
        fastcgi_busy_buffers_size 512k;
        fastcgi_temp_file_write_size 512k;
        
        fastcgi_connect_timeout 300s;
        fastcgi_send_timeout 300s;
        fastcgi_read_timeout 300s;
        
        # Ensure keepalive to upstream
        fastcgi_keep_conn on;
    }

    # Deny direct PHP execution on other PHP files
    location ~ \.php$ {
        return 404;
    }

    # Health check endpoint
    location = /api/health {
        fastcgi_pass php-upstream;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        access_log off;
    }
}
