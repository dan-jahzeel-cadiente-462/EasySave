server {
    # Listen on standard port 80 inside the container
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /app/public;
    index index.php;

    client_max_body_size 100M;

    # Logs
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # Security: Deny sensitive files
    location ~ ^/(\.git|\.env|config/|src/|vendor/|migrations/) {
        deny all;
        return 403;
    }

    # Static file handling
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|map)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Primary Routing
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # PHP-FPM Bridge (Points to the 'php' container)
    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        
        # Symfony specific parameters
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTP_PROXY "";
        
        # High timeouts to prevent 502/504
        fastcgi_read_timeout 600s;
        fastcgi_connect_timeout 600s;
        fastcgi_send_timeout 600s;
    }

    # Prevent direct access to other PHP scripts
    location ~ \.php$ {
        return 404;
    }
}
