# Upstream WebSocket server
# In single-container production, this points to the local websocket process.
upstream ws-upstream {
    server 127.0.0.1:8080;
}

# Server configuration
server {
    listen LISTEN_PORT default_server;
    listen [::]:LISTEN_PORT default_server;
    server_name _;

    root /app/public;
    index index.php index.html;

    client_max_body_size 50M;

    # Logs are routed to stdout/stderr in Dockerfile
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # Deny access to sensitive directories
    location ~ ^/(\.git|\.env|config/|src/|vendor/|migrations/) {
        deny all;
        return 403;
    }

    # Static file caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|map)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Main application routing
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # WebSocket proxy (path: /ws/ or /ws)
    location /ws/ {
        proxy_pass http://ws-upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
    }

    # PHP-FPM handling (Hardcoded to port 9001 for Railway stability)
    location ~ ^/index\.php(/|$) {
        fastcgi_pass 127.0.0.1:9001;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTP_PROXY "";
        
        # Performance tuning
        fastcgi_buffering on;
        fastcgi_buffer_size 256k;
        fastcgi_buffers 512 32k;
        fastcgi_busy_buffers_size 512k;
        fastcgi_temp_file_write_size 512k;
        
        fastcgi_connect_timeout 300s;
        fastcgi_send_timeout 300s;
        fastcgi_read_timeout 300s;
        
        # Ensure keepalive to upstream
        fastcgi_keep_conn on;
    }

    # Deny direct PHP execution on other PHP files
    location ~ \.php$ {
        return 404;
    }

    # Health check endpoint
    location = /api/health {
        fastcgi_pass 127.0.0.1:9001;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        access_log off;
    }
}
