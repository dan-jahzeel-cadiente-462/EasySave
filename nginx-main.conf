server {
    # Port 8080 is the correct one for Railway health checks
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    root /app/public;
    index index.php;

    client_max_body_size 100M;

    # Logs are routed to stdout/stderr in Dockerfile
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # Deny access to sensitive files
    location ~ ^/(\.git|\.env|config/|src/|vendor/|migrations/) {
        deny all;
        return 403;
    }

    # Static file caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|map)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Main application routing
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # PHP-FPM handling (Hardcoded to UNIX socket for absolute stability)
    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        
        # Ensure path info is handled correctly for Symfony
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTP_PROXY "";
        
        # Timeouts to prevent 504 errors
        fastcgi_read_timeout 600s;
        fastcgi_connect_timeout 600s;
        fastcgi_send_timeout 600s;
        
        # Performance tuning
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # Deny direct access to any other .php files
    location ~ \.php$ {
        return 404;
    }

    # Health check endpoint
    location = /api/health {
        fastcgi_pass unix:/run/php-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        access_log off;
    }
}
